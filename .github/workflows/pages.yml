# Builds the game and publishes it on GitHub Pages:
# https://bernardocaldas.github.io/habitacao/
#
# Needs Pages switched on once: Settings → Pages → Build and deployment → Source: GitHub Actions.
# The build uses Vite's relative base (vite.config.ts, base: './'), so it runs from the
# /habitacao/ sub-path without any configuration here.
name: Pages

on:
  push:
    branches: [claude/sharp-cerf-wukco0]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one instead of cancelling it
# half-way through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
