[project]
name = "rentsim"
version = "0.1.0"
description = "Prototype simulator of the 2026 rental-law bill's effects on rents, displacement and affordability"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
rentsim = "rentsim.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rentsim"]
